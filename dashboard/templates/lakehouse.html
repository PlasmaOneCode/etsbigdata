<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta Lakehouse Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg, #f0f4ff 0%, #e8f5e9 50%, #fff8e1 100%);
    min-height: 100vh;
    padding: 20px;
    color: #1a1a2e;
  }

  /* ── HEADER ──────────────────────────── */
  .header {
    background: white;
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.07);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    color: #1a1a2e;
    letter-spacing: -.5px;
  }
  .header h1 .lake { color: #1565C0; }
  .header h1 .house { color: #F57C00; }
  .header-sub {
    font-size: 12px;
    color: #888;
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    text-decoration: none;
    background: #f5f5f5; color: #555;
    border: 1px solid #e0e0e0;
    transition: all .15s;
  }
  .nav-btn:hover { background: #e8eaf6; color: #1565C0; border-color: #9fa8da; }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #E8F5E9; color: #2E7D32;
    border: 1px solid #A5D6A7;
    padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #43A047;
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

  /* ── ARCHITECTURE BAR ────────────────── */
  .arch-bar {
    background: white;
    border-radius: 14px;
    padding: 16px 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    flex-wrap: nowrap;
  }
  .arch-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }
  .chip-kafka  { background: #E3F2FD; color: #1565C0; border: 1.5px solid #90CAF9; }
  .chip-hdfs   { background: #FBE9E7; color: #BF360C; border: 1.5px solid #FFAB91; }
  .chip-spark  { background: #FFF3E0; color: #E65100; border: 1.5px solid #FFB74D; }
  .chip-bronze { background: #FFF8E1; color: #8D6E63; border: 1.5px solid #D7B899; }
  .chip-silver { background: #ECEFF1; color: #546E7A; border: 1.5px solid #B0BEC5; }
  .chip-gold   { background: #FFFDE7; color: #F57F17; border: 1.5px solid #FFD54F; }
  .arch-arrow  { color: #BDBDBD; font-size: 20px; flex-shrink:0; }
  .arch-dot    { font-size: 8px; color: #ccc; }

  /* ── STATS GRID ──────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  @media(max-width:800px){ .stats-grid{ grid-template-columns:1fr 1fr; } }

  .layer-card {
    border-radius: 16px;
    padding: 22px 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    position: relative;
    overflow: hidden;
    color: white;
  }
  .layer-card::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
  }
  .layer-card.bronze { background: linear-gradient(135deg, #BF8A30 0%, #8D5524 100%); }
  .layer-card.silver { background: linear-gradient(135deg, #607D8B 0%, #37474F 100%); }
  .layer-card.gold   { background: linear-gradient(135deg, #F9A825 0%, #F57F17 100%); }

  .layer-label {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px;
    opacity: .8; margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .layer-value { font-size: 38px; font-weight: 800; line-height: 1; }
  .layer-desc  { font-size: 12px; opacity: .8; margin-top: 6px; }
  .layer-meta  {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.2);
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .meta-item .mk { font-size: 10px; opacity:.7; font-family:'JetBrains Mono',monospace; }
  .meta-item .mv { font-size: 14px; font-weight: 700; }

  /* ── WARNING BANNER ──────────────────── */
  .warn-banner {
    background: #FFF9C4;
    border: 1.5px solid #F9A825;
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 13px;
    color: #5D4037;
  }
  .warn-icon { font-size: 20px; flex-shrink:0; line-height:1.3; }
  .warn-text strong { color: #E65100; }
  .warn-text code {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(0,0,0,.06);
    padding: 1px 6px; border-radius: 4px;
    font-size: 12px;
  }

  /* ── SECTION TITLES ──────────────────── */
  .section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: #455A64;
    margin: 24px 0 14px;
  }
  .sec-pill {
    padding: 3px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: .5px;
  }
  .sec-bronze { background: #FFF8E1; color: #8D5524; border: 1.5px solid #D7B899; }
  .sec-silver { background: #ECEFF1; color: #546E7A; border: 1.5px solid #B0BEC5; }
  .sec-gold   { background: #FFFDE7; color: #F57F17; border: 1.5px solid #FFD54F; }
  .sec-time   { background: #F3E5F5; color: #7B1FA2; border: 1.5px solid #CE93D8; }

  /* ── CARDS ───────────────────────────── */
  .card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.07);
    overflow: hidden;
  }
  .card-head {
    padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #f0f0f0;
  }
  .card-head-title {
    font-size: 14px; font-weight: 700; color: #1a1a2e;
    font-family: 'JetBrains Mono', monospace;
  }
  .row-badge {
    background: #F5F5F5; border: 1px solid #E0E0E0;
    border-radius: 6px; padding: 3px 10px;
    font-size: 11px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    color: #757575;
  }

  /* Colored card headers */
  .head-bronze { background: linear-gradient(90deg, #FFF8E1, #FAFAFA); }
  .head-silver { background: linear-gradient(90deg, #ECEFF1, #FAFAFA); }
  .head-gold   { background: linear-gradient(90deg, #FFFDE7, #FAFAFA); }
  .head-purple { background: linear-gradient(90deg, #F3E5F5, #FAFAFA); }

  /* ── TWO COL ─────────────────────────── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media(max-width:800px){ .two-col{ grid-template-columns:1fr; } }

  /* ── TABLES ──────────────────────────── */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 9px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .8px;
    color: #9E9E9E; background: #FAFAFA;
    border-bottom: 1px solid #F0F0F0;
    white-space: nowrap;
  }
  td {
    padding: 10px 16px;
    border-bottom: 1px solid #F8F8F8;
    font-size: 13px; color: #333;
    font-family: 'JetBrains Mono', monospace;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #F5F9FF; }

  /* Bars */
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar {
    height: 8px; border-radius: 4px; flex-shrink:0;
    transition: width .4s;
  }
  .bar-gold   { background: linear-gradient(90deg, #F9A825, #FFD54F); }
  .bar-blue   { background: linear-gradient(90deg, #1976D2, #64B5F6); }
  .bar-silver { background: linear-gradient(90deg, #607D8B, #B0BEC5); }
  .bar-green  { background: linear-gradient(90deg, #388E3C, #81C784); }

  /* Value decorations */
  .val-num { font-weight: 700; color: #1a1a2e; }
  .null-val { color: #BDBDBD; font-style: italic; font-size: 11px; }
  .up-arrow { color: #388E3C; font-weight: 700; }
  .dash-val { color: #BDBDBD; }
  .pct-val  { color: #F57F17; font-weight: 700; }

  /* Version badges */
  .ver-badge {
    display: inline-block; padding: 2px 8px; border-radius: 5px;
    background: #E8EAF6; color: #3949AB;
    font-size: 11px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid #9FA8DA;
  }
  .op-badge {
    display: inline-block; padding: 2px 8px; border-radius: 5px;
    background: #FFF8E1; color: #F57F17;
    font-size: 11px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid #FFD54F;
  }

  /* Silver transforms */
  .tf-list { padding: 14px 18px; display:flex; flex-direction:column; gap:10px; }
  .tf-item { display:flex; align-items:flex-start; gap:10px; font-size:13px; color:#333; }
  .tf-num {
    width:22px; height:22px; border-radius:50%; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800;
    background: #ECEFF1; color: #546E7A;
    border: 1.5px solid #B0BEC5;
    margin-top:1px;
  }

  /* Bronze info block */
  .bronze-info {
    padding: 14px 18px;
    font-size: 12px; font-family:'JetBrains Mono',monospace; color:#888;
  }
  .bronze-info span { color:#5D4037; font-weight:600; }

  /* Empty */
  .empty-state {
    padding: 32px; text-align:center;
    color: #BDBDBD; font-size:13px;
    font-family:'JetBrains Mono',monospace;
  }

  /* Loading */
  .loading-wrap {
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:40px; color:#888; font-size:14px;
  }
  .spinner {
    width:18px; height:18px;
    border: 2.5px solid #E0E0E0;
    border-top-color: #1976D2;
    border-radius:50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to{ transform:rotate(360deg); } }

  /* Error */
  .err-box {
    background:#FFEBEE; border:1.5px solid #EF9A9A;
    border-radius:10px; padding:14px 18px;
    color:#C62828; font-size:13px;
    font-family:'JetBrains Mono',monospace;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div>
    <h1>Delta <span class="lake">Lake</span><span class="house">house</span> Dashboard</h1>
    <div class="header-sub">Kafka → HDFS → Spark → Bronze → Silver → Gold</div>
  </div>
  <div class="header-right">
    <div class="live-badge"><span class="live-dot"></span><span id="status-txt">Loading…</span></div>
    <a class="nav-btn" href="/">← News Dashboard</a>
  </div>
</div>

<!-- Architecture bar -->
<div class="arch-bar">
  <span class="arch-chip chip-kafka">📨 Kafka</span>
  <span class="arch-arrow">→</span>
  <span class="arch-chip chip-hdfs">🗄 HDFS</span>
  <span class="arch-arrow">→</span>
  <span class="arch-chip chip-spark">⚡ Spark</span>
  <span class="arch-arrow">→</span>
  <span class="arch-chip chip-bronze">🥉 Bronze</span>
  <span class="arch-arrow">→</span>
  <span class="arch-chip chip-silver">🥈 Silver</span>
  <span class="arch-arrow">→</span>
  <span class="arch-chip chip-gold">🥇 Gold</span>
</div>

<!-- Stats cards -->
<div class="stats-grid" id="stats-grid">
  <div class="loading-wrap"><div class="spinner"></div>Memuat data…</div>
</div>

<!-- Main content -->
<div id="main-content"></div>

<script>
async function loadData() {
  try {
    const res = await fetch('/api/lakehouse');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    render(d);
    document.getElementById('status-txt').textContent = 'Data Aktif';
  } catch(e) {
    document.getElementById('status-txt').textContent = 'Error';
    document.getElementById('stats-grid').innerHTML =
      `<div class="err-box">⚠ ${e.message}</div>`;
    console.error(e);
  }
}

function fmt(n) { return n == null ? '—' : Number(n).toLocaleString('id-ID'); }
function nullVal(v) {
  if (v === null || v === undefined) return '<span class="null-val">null</span>';
  if (typeof v === 'number') return v.toFixed(2);
  return v;
}

function render(d) {
  const s = d.stats;

  /* ── Stats cards ─────────────────────── */
  document.getElementById('stats-grid').innerHTML = `
    <div class="layer-card bronze">
      <div class="layer-label">🥉 Bronze Layer</div>
      <div class="layer-value">${fmt(s.bronze.total)}</div>
      <div class="layer-desc">total records (raw)</div>
      <div class="layer-meta">
        <div class="meta-item">
          <div class="mk">API</div>
          <div class="mv">${fmt(s.bronze.api_count)}</div>
        </div>
        <div class="meta-item">
          <div class="mk">RSS</div>
          <div class="mv">${fmt(s.bronze.rss_count)}</div>
        </div>
      </div>
    </div>
    <div class="layer-card silver">
      <div class="layer-label">🥈 Silver Layer</div>
      <div class="layer-value">${fmt(s.silver.count)}</div>
      <div class="layer-desc">records after cleaning</div>
      <div class="layer-meta">
        <div class="meta-item">
          <div class="mk">Columns</div>
          <div class="mv">${fmt(s.silver.columns.length)}</div>
        </div>
        <div class="meta-item">
          <div class="mk">Transforms</div>
          <div class="mv">5</div>
        </div>
      </div>
    </div>
    <div class="layer-card gold">
      <div class="layer-label">🥇 Gold Layer</div>
      <div class="layer-value">${fmt(s.gold.tables)}</div>
      <div class="layer-desc">aggregated tables</div>
      <div class="layer-meta">
        <div class="meta-item">
          <div class="mk">word_freq</div>
          <div class="mv">${fmt(s.gold.word_freq_rows)}</div>
        </div>
        <div class="meta-item">
          <div class="mk">velocity</div>
          <div class="mv">${fmt(s.gold.word_velocity_rows)}</div>
        </div>
      </div>
    </div>
  `;

  /* ── Warning if Silver is small ──────── */
  const warnHTML = s.silver.count <= 5 ? `
    <div class="warn-banner">
      <div class="warn-icon">⚠️</div>
      <div class="warn-text">
        <strong>Mengapa data Gold sangat sedikit?</strong><br>
        Silver hanya punya <strong>${s.silver.count} record</strong> karena <code>02_silver.py</code>
        dijalankan saat Bronze masih kosong/sangat kecil.
        Bronze sekarang sudah punya <strong>${fmt(s.bronze.total)} records</strong> (${s.bronze.api_count} API + ${s.bronze.rss_count} RSS).
        <br>Jalankan ulang: <code>python lakehouse/02_silver.py</code> → <code>python lakehouse/03_gold.py</code>
        untuk mendapatkan hasil lengkap (~28 artikel bersih dari 59 URL unik).
      </div>
    </div>` : '';

  /* ── Table builders ──────────────────── */
  const maxWF  = Math.max(...d.word_freq.map(r=>r.count), 1);
  const maxVel = Math.max(...d.word_velocity.map(r=>r.freq_per_jam), 1);
  const maxSrc = Math.max(...d.news_per_source.map(r=>r.total_news), 1);

  const wfRows = d.word_freq.length
    ? d.word_freq.map(r=>`
        <tr>
          <td>${r.word}</td>
          <td><div class="bar-row">
            <div class="bar bar-gold" style="width:${Math.round(r.count/maxWF*130)}px"></div>
            <span class="val-num">${fmt(r.count)}</span>
          </div></td>
        </tr>`).join('')
    : `<tr><td colspan="2"><div class="empty-state">Tidak ada data</div></td></tr>`;

  const npsRows = d.news_per_source.length
    ? d.news_per_source.map(r=>`
        <tr>
          <td>${r.source_normalized}</td>
          <td><div class="bar-row">
            <div class="bar bar-silver" style="width:${Math.round(r.total_news/maxSrc*130)}px"></div>
            <span class="val-num">${fmt(r.total_news)}</span>
          </div></td>
        </tr>`).join('')
    : `<tr><td colspan="2"><div class="empty-state">Tidak ada data</div></td></tr>`;

  const wvRows = d.word_velocity.length
    ? d.word_velocity.map(r=>`
        <tr>
          <td>${r.jam}:00</td>
          <td>${r.word}</td>
          <td><div class="bar-row">
            <div class="bar bar-blue" style="width:${Math.round(r.freq_per_jam/maxVel*80)}px"></div>
            <span class="val-num">${fmt(r.freq_per_jam)}</span>
          </div></td>
          <td>${r.prev_freq !== null ? r.prev_freq : '<span class="null-val">null</span>'}</td>
          <td class="up-arrow">${r.velocity > 0 ? '↑' : '<span class="dash-val">—</span>'} ${fmt(r.velocity)}</td>
          <td class="pct-val">${r.velocity_pct !== null ? r.velocity_pct.toFixed(1)+'%' : nullVal(r.velocity_pct)}</td>
        </tr>`).join('')
    : `<tr><td colspan="6"><div class="empty-state">Tidak ada data</div></td></tr>`;

  const cstRows = d.cross_source_topics.length
    ? d.cross_source_topics.map(r=>`
        <tr>
          <td>${r.jam}:00</td>
          <td>${r.word}</td>
          <td>${r.sources}</td>
          <td class="val-num">${fmt(r.cross_source_mentions)}</td>
        </tr>`).join('')
    : `<tr><td colspan="4"><div class="empty-state">
         Tidak ada data — dibutuhkan ≥ 2 sumber membahas kata yang sama dalam jam yang sama
       </div></td></tr>`;

  const ttRows = d.time_travel.length
    ? d.time_travel.map(r=>`
        <tr>
          <td><span class="ver-badge">v${r.version}</span></td>
          <td>${r.timestamp}</td>
          <td><span class="op-badge">${r.operation}</span></td>
          <td class="val-num">${fmt(r.rows_written)}</td>
          <td>${fmt(r.num_files)}</td>
          <td>${fmt(r.bytes)} B</td>
        </tr>`).join('')
    : `<tr><td colspan="6"><div class="empty-state">Tidak ada history</div></td></tr>`;

  const tfItems = s.silver.transformations.map((t,i)=>`
    <div class="tf-item">
      <span class="tf-num">${i+1}</span>
      <span>${t}</span>
    </div>`).join('');

  /* ── Render page ─────────────────────── */
  document.getElementById('main-content').innerHTML = `
    ${warnHTML}

    <!-- Bronze Section -->
    <div class="section-title">
      <span class="sec-pill sec-bronze">🥉 BRONZE</span>
      Raw Ingest — Delta Format, Schema-on-Write
    </div>
    <div class="two-col">
      <div class="card">
        <div class="card-head head-bronze">
          <span class="card-head-title">news_api</span>
          <span class="row-badge">${fmt(s.bronze.api_count)} rows</span>
        </div>
        <div class="bronze-info">
          Last ingested: <span>${s.bronze.last_api_ingested || '—'}</span><br>
          Format: Delta Parquet · Sumber: NewsAPI
        </div>
      </div>
      <div class="card">
        <div class="card-head head-bronze">
          <span class="card-head-title">news_rss</span>
          <span class="row-badge">${fmt(s.bronze.rss_count)} rows</span>
        </div>
        <div class="bronze-info">
          Last ingested: <span>${s.bronze.last_rss_ingested || '—'}</span><br>
          Format: Delta Parquet · Sumber: RSS Feed
        </div>
      </div>
    </div>

    <!-- Silver Section -->
    <div class="section-title">
      <span class="sec-pill sec-silver">🥈 SILVER</span>
      5 Cleaning Transformations — Spark DataFrame
    </div>
    <div class="card">
      <div class="card-head head-silver">
        <span class="card-head-title">silver/news</span>
        <span class="row-badge">${fmt(s.silver.count)} rows · ${s.silver.columns.length} cols</span>
      </div>
      <div class="tf-list">${tfItems}</div>
    </div>

    <!-- Gold Section -->
    <div class="section-title">
      <span class="sec-pill sec-gold">🥇 GOLD</span>
      4 Aggregated Tables — Business Logic
    </div>
    <div class="two-col">
      <div class="card">
        <div class="card-head head-gold">
          <span class="card-head-title">word_freq</span>
